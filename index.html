<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Page with Iframe Communication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent-container">
        <h1>Parent Page Communication</h1>
        <div class="control-panel">
            <div class="input-group">
                <input type="text" id="parentMessageInput" placeholder="Message to send to iframe">
                <button id="parentSendButton">Send to Iframe</button>
            </div>
            <div class="received-messages">
                <h2>Messages from Iframe:</h2>
                <div id="parentMessagesContainer"></div>
            </div>
        </div>
        <div class="iframe-container">
            <h2>Iframe Content</h2>
            <iframe id="childFrame" src="https://websim.ai/@api/iframetest1" title="Child Frame"></iframe>
        </div>
    </div>
    <script type="module" src="parent.js"></script>
